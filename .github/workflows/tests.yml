name: MintGuard checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q cleaner.py modules tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Import the Qt user interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import cleaner; print('UI import OK')"
