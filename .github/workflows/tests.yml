name: MintGuard checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q cleaner.py modules tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Launch Qt dashboard headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import time
          from PySide6.QtWidgets import QApplication
          from cleaner import MintGuard
          app = QApplication([])
          window = MintGuard()
          deadline = time.monotonic() + 30
          while window.worker is not None and time.monotonic() < deadline:
              app.processEvents()
              time.sleep(0.025)
          app.processEvents()
          assert window.worker is None, "Dashboard scan did not finish"
          assert window.cards["apt"].metric.text() != "Taranıyor…"
          window.close()
          print("Dashboard smoke test OK")
          PY

  package:
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 dpkg-dev
          python -m pip install -r requirements.txt pyinstaller
      - name: Bundle MintGuard and create DEB
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name mintguard --add-data "assets/mintguard.svg:assets" cleaner.py
          python packaging/build_deb.py
          dpkg-deb --info build/mintguard_2.0.0_amd64.deb
          dpkg-deb --contents build/mintguard_2.0.0_amd64.deb | tail -15
      - uses: actions/upload-artifact@v4
        with:
          name: mintguard-deb
          path: build/mintguard_2.0.0_amd64.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mintguard-deb
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.deb --repo "$GITHUB_REPOSITORY" --generate-notes
